# main = staging, release = production.
# Merge main -> release to ship.
name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a version that is already released
        run: |
          VERSION=$(node -p "require('./public/manifest.json').version")
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "::error::Version ${VERSION} is already released. Bump public/manifest.json version."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests drive Chromium through Playwright.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ci:local
      - name: Archive the source for AMO review
        run: git archive --format=zip -o source.zip HEAD
      - name: Sign with AMO
        run: |
          missing=0
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Signing needs it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          pnpm exec web-ext sign -s dist -a web-ext-artifacts/signed --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
            --upload-source-code source.zip
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./dist/manifest.json').version")
          TAG="v${VERSION}"
          FILES=(web-ext-artifacts/signed/*.xpi)
          if [ ! -e "${FILES[0]}" ]; then
            echo "::error::Signing produced no .xpi file."
            exit 1
          fi
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
