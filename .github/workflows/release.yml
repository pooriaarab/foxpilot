# main = staging, release = production.
# Merge main -> release to ship.
name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests drive Chromium through Playwright.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ci:local
      - id: plan
        run: node scripts/release-plan.mjs

  sign:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs ${{ matrix.app }}
      - name: Archive the source for AMO review
        run: git archive --format=zip -o source.zip HEAD
      - name: Sign with AMO
        run: |
          missing=0
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Signing needs it."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          pnpm exec web-ext sign -s "dist/${{ matrix.app }}" -a "web-ext-artifacts/${{ matrix.app }}" \
            --channel="${{ matrix.channel }}" \
            --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
            --upload-source-code source.zip
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.app }}-v${{ matrix.version }}"
          FILES=("web-ext-artifacts/${{ matrix.app }}"/*.xpi)
          if [ ! -e "${FILES[0]}" ]; then
            echo "::error::Signing produced no .xpi file."
            exit 1
          fi
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
