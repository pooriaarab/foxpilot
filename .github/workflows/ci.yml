name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests drive Chromium through Playwright.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      # Bundled models (foxmind-small) are pinned by revision and sha256, so
      # the cache key is the registry file: a changed pin fetches again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/foxpilot/models
          key: models-${{ hashFiles('packages/core/src/model/models.ts') }}
      - run: node scripts/apps.mjs build
      - run: pnpm lint:ext
