<!doctype html>
<meta charset="utf-8">
<title>OneTrust-style hidden switches</title>
<style>
  .row { position: relative; display: flex; justify-content: space-between; align-items: center; width: 420px; padding: 8px 0; border-bottom: 1px solid #ddd; }
  .row > button { position: absolute; inset: 0; background: none; border: 0; }
  .row h4 { margin: 0; }
  .tgl { position: relative; z-index: 1; }
  .tgl input { position: absolute; width: 0; height: 0; opacity: 0; }
  .switch { display: inline-block; width: 40px; height: 20px; border-radius: 10px; background: #bbb; position: relative; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .1s; }
  .tgl input:checked + .switch { background: #3860be; }
  .tgl input:checked + .switch::after { left: 22px; }
  .switch span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
<p>A page about canal locks.</p>
<div data-dialog data-box style="position:fixed;bottom:0;left:0;right:0;padding:12px;background:#eee">
  <p>We use cookies to improve your experience and for marketing.</p>
  <button>Accept all cookies</button> <button data-show="pc">Customize settings</button>
</div>
<div id="pc" role="dialog" aria-modal="true" data-dialog data-box hidden style="position:fixed;top:5%;left:20%;padding:12px;background:#fff">
  <h2>Cookie consent preference center</h2>
  <div class="row"><button aria-expanded="false" aria-labelledby="h1"></button><h4 id="h1">Strictly Necessary Cookies</h4><span>Always Active</span></div>
  <div class="row"><button aria-expanded="false" aria-labelledby="h2"></button><h4 id="h2">Functional Cookies</h4>
    <div class="tgl"><input type="checkbox" id="g2" data-optional checked aria-labelledby="h2"><label class="switch" for="g2"><span>Functional Cookies</span></label></div></div>
  <div class="row"><button aria-expanded="false" aria-labelledby="h3"></button><h4 id="h3">Targeting Cookies</h4>
    <div class="tgl"><input type="checkbox" id="g3" data-optional checked aria-labelledby="h3"><label class="switch" for="g3"><span>Targeting Cookies</span></label></div></div>
  <div class="row"><button aria-expanded="false" aria-labelledby="h4"></button><h4 id="h4">Performance Cookies</h4>
    <div class="tgl"><input type="checkbox" id="g4" data-optional checked aria-labelledby="h4"><label class="switch" for="g4"><span>Performance Cookies</span></label></div></div>
  <p><button data-close>Necessary cookies only</button> <button data-close>Confirm my choices</button></p>
</div>
<script>
  // The accordion headers open a description; they do not change consent.
  for (const b of document.querySelectorAll(".row > button")) b.addEventListener("click", () => b.setAttribute("aria-expanded", String(b.getAttribute("aria-expanded") !== "true")));
</script>
<script src="kit.js"></script>
